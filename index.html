<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4.5 Years of You, Krisha 🌻</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --cream: #fdf8f0;
    --warm-white: #fffdf7;
    --sunflower: #f5c842;
    --tulip-pink: #f2a7b0;
    --lily-purple: #c9b8e8;
    --sage: #b5c9a8;
    --text-dark: #2c1810;
    --text-mid: #6b4c3b;
    --text-light: #a08070;
    --accent: #c06b3a;
  }
  body {
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    color: var(--text-dark);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .bg-flowers {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  }
  .bg-flower {
    position: absolute; opacity: 0.07; font-size: 4rem;
    animation: floatFlower linear infinite; user-select: none;
  }
  @keyframes floatFlower {
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.07; } 90% { opacity: 0.07; }
    100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
  }
  #cover {
    position: fixed; inset: 0;
    background: linear-gradient(160deg, #fdf3d8 0%, #fce8e8 50%, #ede0f5 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; text-align: center; padding: 2rem;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  #cover.hidden { opacity: 0; transform: scale(1.05); pointer-events: none; }
  .cover-flowers { font-size: 3rem; margin-bottom: 1.5rem; animation: sway 3s ease-in-out infinite; }
  @keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  .cover-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.2rem, 8vw, 4rem); font-weight: 300;
    color: var(--text-dark); line-height: 1.2; margin-bottom: 0.5rem;
  }
  .cover-title em { font-style: italic; color: var(--accent); }
  .cover-date {
    font-family: 'DM Sans', sans-serif; font-size: 0.8rem;
    color: var(--text-light); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 2rem;
  }
  .cover-prompt {
    font-family: 'Cormorant Garamond', serif; font-size: 1.1rem;
    color: var(--text-mid); margin-bottom: 2.5rem; font-style: italic; line-height: 1.6;
  }
  .start-btn {
    background: var(--text-dark); color: var(--cream); border: none;
    padding: 1rem 2.5rem; font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
    letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer;
    border-radius: 50px; transition: all 0.3s ease;
  }
  .start-btn:hover { background: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(192,107,58,0.3); }
  #experience { display: none; min-height: 100vh; }
  #experience.visible { display: block; }
  .progress-bar {
    position: fixed; top: 0; left: 0; height: 3px;
    background: linear-gradient(90deg, var(--sunflower), var(--tulip-pink), var(--lily-purple));
    z-index: 50; transition: width 0.5s ease; border-radius: 0 2px 2px 0;
  }
  .nav {
    position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
    display: flex; gap: 1rem; z-index: 50; align-items: center;
  }
  .nav-btn {
    background: rgba(44,24,16,0.85); color: var(--cream); border: none;
    width: 48px; height: 48px; border-radius: 50%; font-size: 1.2rem;
    cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { background: var(--accent); transform: scale(1.1); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .nav-counter { font-size: 0.75rem; color: var(--text-mid); letter-spacing: 0.1em; min-width: 60px; text-align: center; }
  .cards-container { position: relative; width: 100%; min-height: 100vh; }
  .card {
    display: none; min-height: 100vh; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 3rem 1.5rem 6rem; animation: cardIn 0.6s ease forwards; position: relative;
  }
  .card.active { display: flex; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-year {
    font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--text-light); margin-bottom: 1.2rem;
  }
  .card-year::before { content: ''; display: inline-block; width: 20px; height: 1px; background: var(--text-light); margin-right: 8px; vertical-align: middle; }
  .card-year::after { content: ''; display: inline-block; width: 20px; height: 1px; background: var(--text-light); margin-left: 8px; vertical-align: middle; }
  .photo-frame {
    position: relative; max-width: min(380px, 88vw); width: 100%; margin-bottom: 1.8rem;
  }
  .photo-frame::before {
    content: ''; position: absolute; inset: -8px;
    border: 1px solid rgba(192,107,58,0.2); border-radius: 4px; z-index: 0;
  }
  .photo-frame img {
    width: 100%; height: auto; max-height: 62vh; object-fit: cover;
    display: block; border-radius: 3px; position: relative; z-index: 1;
    box-shadow: 0 20px 60px rgba(44,24,16,0.15);
  }
  .flower-accent {
    position: absolute; font-size: 1.8rem; z-index: 2;
    animation: gentleSway 4s ease-in-out infinite;
  }
  .flower-accent.tl { top: -20px; left: -20px; animation-delay: 0s; }
  .flower-accent.br { bottom: -20px; right: -20px; animation-delay: 1s; }
  @keyframes gentleSway {
    0%, 100% { transform: rotate(-10deg) scale(1); }
    50% { transform: rotate(10deg) scale(1.1); }
  }
  .card-caption {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.3rem, 4.5vw, 1.8rem); font-weight: 300; font-style: italic;
    color: var(--text-dark); text-align: center; max-width: 340px; line-height: 1.5;
  }
  #closing {
    display: none; min-height: 100vh; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 3rem 2rem 6rem;
    background: linear-gradient(160deg, #fdf3d8 0%, #fce8e8 60%, #ede0f5 100%);
    animation: cardIn 0.8s ease forwards;
  }
  #closing.active { display: flex; }
  .closing-flowers { font-size: 2.5rem; margin-bottom: 2rem; animation: sway 3s ease-in-out infinite; }
  .closing-main {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.8rem, 7vw, 3rem); font-weight: 300;
    color: var(--text-dark); line-height: 1.4; margin-bottom: 1rem; max-width: 400px;
  }
  .closing-main em { font-style: italic; color: var(--accent); }
  .closing-sub {
    font-size: 0.85rem; color: var(--text-light); letter-spacing: 0.15em;
    text-transform: uppercase; margin-bottom: 3rem;
  }
  .closing-heart { font-size: 2rem; animation: heartbeat 1.5s ease-in-out infinite; }
  @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
  .restart-btn {
    margin-top: 2.5rem; background: transparent; color: var(--text-mid);
    border: 1px solid var(--text-mid); padding: 0.7rem 2rem;
    font-family: 'DM Sans', sans-serif; font-size: 0.75rem; letter-spacing: 0.2em;
    text-transform: uppercase; cursor: pointer; border-radius: 50px; transition: all 0.3s ease;
  }
  .restart-btn:hover { background: var(--text-dark); color: var(--cream); border-color: var(--text-dark); }
</style>
</head>
<body>
<div class="bg-flowers" id="bgFlowers"></div>
<div id="cover">
  <div class="cover-flowers">🌻🌷🌸</div>
  <h1 class="cover-title">4.5 years, Kiki.<br><em>Still your chotu baby.</em><br><span style="font-size:0.6em;font-style:normal;letter-spacing:0.1em;color:#a08070;">Always will be.</span></h1>
  <p class="cover-date">December 1, 2021 — Today</p>
  <p class="cover-prompt">Have a look 🤍<br>I hope it takes you back to all these different eras of usss.</p>
  <button class="start-btn" id="startBtn">Open ✦</button>
</div>
<div id="experience">
  <div class="progress-bar" id="progressBar"></div>
  <div class="cards-container" id="cardsContainer"></div>
  <div id="closing">
    <div class="closing-flowers">🌻🌷🌸</div>
    <h2 class="closing-main">Still your favourite person?<br>Good.<br><em>Because you're mine.</em></h2>
    <p class="closing-sub">Happy 4.5, Krisha 🤍</p>
    <div class="closing-heart">🌻</div>
    <button class="restart-btn" onclick="restart()">Go back to the beginning</button>
  </div>
  <div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>←</button>
    <span class="nav-counter" id="navCounter">1 / 18</span>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)">→</button>
  </div>
</div>
<script>
const photos = [
  { year: "Dec 2021", caption: "Even masks couldn't hide how happy we were to just be in the same room.", src: "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsL[...]
  { year: "Dec 2021", caption: "The beginning of being each other's shadow. Forever.", src: "data:image/png;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6AB[...]
  { year: "Dec 2021", caption: "3-4 hours every day like it still wasn't enough.", src: "data:image/png;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMA[...]
  { year: "Dec 2021", caption: "Right before everything changed. You were shy. I was completely gone.", src: "data:image/png;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAA[...]
  { year: "2022", caption: "Those eyes. They got me.", src: "data:image/png;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAACQKAD[...]
  { year: "2022", caption: "Didn't think we'd end up here. But boy, was this trip fun.", src: "data:image/png;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6[...]
];

let currentCardIndex = 0;

function startExperience() {
  document.getElementById("cover").classList.add("hidden");
  document.getElementById("experience").classList.add("visible");
  renderCards();
  updateProgress();
}

function renderCards() {
  const container = document.getElementById("cardsContainer");
  photos.forEach((photo, index) => {
    const card = document.createElement("div");
    card.className = `card ${index === 0 ? "active" : ""}`;
    card.innerHTML = `
      <div class="card-year">${photo.year}</div>
      <div class="photo-frame">
        <img src="${photo.src}" alt="${photo.caption}">
        <span class="flower-accent tl">🌻</span>
        <span class="flower-accent br">🌷</span>
      </div>
      <p class="card-caption">${photo.caption}</p>
    `;
    container.appendChild(card);
  });
}

function navigate(direction) {
  const cards = document.querySelectorAll(".card");
  const maxIndex = cards.length;
  
  currentCardIndex += direction;
  
  if (currentCardIndex >= maxIndex) {
    showClosing();
    return;
  }
  
  if (currentCardIndex < 0) currentCardIndex = 0;
  
  cards.forEach((card, index) => {
    card.classList.toggle("active", index === currentCardIndex);
  });
  
  updateProgress();
  updateNavButtons();
}

function updateProgress() {
  const progress = ((currentCardIndex + 1) / (photos.length + 1)) * 100;
  document.getElementById("progressBar").style.width = progress + "%";
  document.getElementById("navCounter").textContent = `${currentCardIndex + 1} / ${photos.length}`;
}

function updateNavButtons() {
  document.getElementById("prevBtn").disabled = currentCardIndex === 0;
  document.getElementById("nextBtn").disabled = currentCardIndex >= photos.length - 1;
}

function showClosing() {
  document.getElementById("closing").classList.add("active");
  document.querySelector(".nav").style.display = "none";
}

function restart() {
  currentCardIndex = 0;
  document.getElementById("closing").classList.remove("active");
  document.querySelector(".nav").style.display = "flex";
  document.getElementById("cover").classList.remove("hidden");
  document.getElementById("experience").classList.remove("visible");
}

// Event listener for start button - wrapped in DOMContentLoaded to ensure DOM is ready
document.addEventListener("DOMContentLoaded", function() {
  document.getElementById("startBtn").addEventListener("click", startExperience);
  updateNavButtons();
});
</script>
</body>
</html>
